<!DOCTYPE html>
<html>
<head>
  <title>Clear Storage - Unit Cost RS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .container {
      background: white;
      color: #333;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    }
    h1 { color: #667eea; margin-top: 0; }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
    }
    button:hover { background: #764ba2; }
    .status {
      padding: 15px;
      margin: 15px 0;
      border-radius: 5px;
      background: #f0f0f0;
    }
    .success { background: #d4edda; color: #155724; }
    .warning { background: #fff3cd; color: #856404; }
    ul { text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧹 Clear Browser Storage</h1>
    <p>Halaman ini akan membersihkan semua data browser untuk aplikasi Unit Cost RS.</p>
    
    <button onclick="clearAll()">🗑️ Clear All Storage & Cache</button>
    <button onclick="window.location.href='/login'">🔑 Go to Login</button>
    
    <div id="status"></div>
    
    <div class="status">
      <strong>Yang akan dibersihkan:</strong>
      <ul>
        <li>localStorage (auth tokens, settings)</li>
        <li>sessionStorage (temporary data)</li>
        <li>Service Workers (if any)</li>
        <li>Cache Storage (bundled files)</li>
        <li>IndexedDB (if any)</li>
      </ul>
    </div>
  </div>

  <script>
    async function clearAll() {
      const status = document.getElementById('status');
      status.className = 'status warning';
      status.innerHTML = '⏳ Clearing storage...';
      
      try {
        // 1. Clear localStorage
        localStorage.clear();
        console.log('✅ localStorage cleared');
        
        // 2. Clear sessionStorage
        sessionStorage.clear();
        console.log('✅ sessionStorage cleared');
        
        // 3. Unregister service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (let registration of registrations) {
            await registration.unregister();
            console.log('✅ Service worker unregistered');
          }
        }
        
        // 4. Clear cache storage
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          for (let name of cacheNames) {
            await caches.delete(name);
            console.log('✅ Cache deleted:', name);
          }
        }
        
        // 5. Clear IndexedDB
        if ('indexedDB' in window) {
          const dbs = await indexedDB.databases();
          for (let db of dbs) {
            if (db.name) {
              indexedDB.deleteDatabase(db.name);
              console.log('✅ IndexedDB deleted:', db.name);
            }
          }
        }
        
        status.className = 'status success';
        status.innerHTML = `
          <strong>✅ All storage cleared successfully!</strong><br><br>
          <strong>Next steps:</strong><br>
          1. Close this browser tab<br>
          2. Close ALL other tabs dari aplikasi ini<br>
          3. Close browser completely<br>
          4. Reopen browser<br>
          5. Navigate to: <a href="/login">Login Page</a><br><br>
          Redirecting to login in 5 seconds...
        `;
        
        setTimeout(() => {
          window.location.href = '/login';
        }, 5000);
        
      } catch (error) {
        console.error('Error clearing storage:', error);
        status.className = 'status warning';
        status.innerHTML = `⚠️ Error: ${error.message}<br>Please clear browser data manually.`;
      }
    }
    
    // Auto-run on page load
    window.addEventListener('load', () => {
      console.log('%c🧹 Clear Storage Page Loaded', 'color: blue; font-size: 16px; font-weight: bold');
      console.log('%cClick the button to clear all storage', 'color: gray');
    });
  </script>
</body>
</html>
